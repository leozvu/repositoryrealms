name: Realms staging release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify staging or deploy migrations and application
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy
      confirmation:
        description: Type DEPLOY_REALMS_STAGING_MIGRATIONS for a deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crmegoric-realms-staging
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: realms-staging
    env:
      REALMS_DEPLOY_ENV: staging
      REALMS_STAGING_DATABASE_URL: ${{ secrets.REALMS_STAGING_DATABASE_URL }}
      REALMS_STAGING_APPROVAL: ${{ secrets.REALMS_STAGING_APPROVAL }}
      REALMS_STAGING_ALLOW_UNMARKED_TARGET: ${{ vars.REALMS_STAGING_ALLOW_UNMARKED_TARGET || '0' }}
      DATABASE_URL: ${{ secrets.REALMS_STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.REALMS_STAGING_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.STAGING_NEXTAUTH_URL }}
      REALM_ERP_SYNC_ENABLED: '1'
      NEXT_PUBLIC_REALM_ERP_SYNC: '1'
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quality gate
        run: npm run qa
      - name: Verify migration chain on staging
        if: inputs.action == 'verify'
        env:
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: npm run staging:migrations:verify
      - name: Validate deploy confirmation
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "DEPLOY_REALMS_STAGING_MIGRATIONS" || {
            echo "Deployment confirmation is missing or incorrect."
            exit 1
          }
      - name: Deploy staging migrations
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ''
          DIRECT_URL: ''
          REALMS_STAGING_MIGRATION_CONFIRM: ${{ inputs.confirmation }}
        run: npm run staging:migrations:deploy -- --commit
      - name: Verify staging after migration
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ''
          DIRECT_URL: ''
        run: npm run staging:migrations:verify
      - name: Deploy isolated Vercel staging project
        if: inputs.action == 'deploy'
        run: npx vercel@54.12.2 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
