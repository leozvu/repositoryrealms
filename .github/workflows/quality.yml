name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crmegoric_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d crmegoric_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crmegoric_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/crmegoric_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migration:ci

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crmegoric_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/crmegoric_ci?schema=public
      NEXTAUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://127.0.0.1:3400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run config:check
      - run: npm run test:coverage
      - run: npm run audit:prod
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
